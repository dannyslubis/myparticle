<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Mole Bridge - Jumlah Partikel</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* === SETUP GLOBAL & RESPONSIVITAS === */
        body {
            display: flex; justify-content: center; align-items: center;     
            height: 100vh; height: 100svh; width: 100vw;
            background-color: #1a1a1a; margin: 0; padding: 0;
            font-family: 'VT323', monospace; color: white;
            touch-action: none; overflow: hidden;        
        }
        #game-container {
            position: relative; width: 100%; height: 100%;
            max-width: calc(100vh * (16 / 9)); max-width: calc(100svh * (16 / 9));
            max-height: calc(100vw * (9 / 16)); aspect-ratio: 16 / 9;
            background-color: #000;
            image-rendering: pixelated; image-rendering: crisp-edges;
            container-type: inline-size; overflow: hidden;
        }

        .layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
            image-rendering: inherit;
        }

        /* === TITLE SCREEN === */
        #scene-title { z-index: 50; background-color: #000; transition: opacity 0.5s ease; }
        #layer-titlescreen { background-image: url('titlescreen.png'); z-index: 51; }

        /* === SCENE: PULAU JUMLAH PARTIKEL === */
        #scene-partikel { z-index: 10; display: none; }
        
        /* Kanvas Utama */
        #layer-canvas-partikel { background-image: url('kanvasmbp.png'); z-index: 1; }

        /* Wadah Penangkapan Kursor/Sentuhan */
        #layer-lattice-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; overflow: hidden; cursor: grab;
        }
        #layer-lattice-container:active { cursor: grabbing; }

        /* Tiling Infinity Background (Looping Sempurna) */
        #infinite-lattice {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: 6cqw 6cqw, 6cqw 6cqw;
            background-repeat: repeat, repeat;
        }

        /* UI Overlays */
        #layer-infokey { background-image: url('mbpinfokey.png'); z-index: 3; pointer-events: none; }
        #layer-zat-label { background-image: url('mbpnacl.png'); z-index: 4; pointer-events: none; }
        #layer-nav-partikel { background-image: url('mbkey2.png'); z-index: 4; pointer-events: none; }

        /* Teks Jumlah Mol di Kanvas (n7-p7 -> x: 81.25%, y: 66.66%) */
        #text-mol-display {
            position: absolute; left: 81.25%; top: 66.66%; width: 18.75%; height: 11.11%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 4cqw; z-index: 5; text-shadow: 2px 2px 0 #000;
        }

        /* Sistem Tombol Grid Transparan */
        .btn-grid { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 10; }

        /* === POP-UP HITUNG JUMLAH PARTIKEL === */
        .popup-layer { display: none; z-index: 20; }
        #popup-calc-partikel { background-image: url('popupmbp.png'); }

        .calc-text {
            position: absolute; display: flex; align-items: center; 
            color: #000; font-size: 3.5cqw; 
        }
        
        /* g5-i5: Input Mol (x:37.5%, y:44.44%, w:18.75%, h:11.11%) */
        #calc-input-mol { left: 37.5%; top: 44.44%; width: 18.75%; height: 11.11%; justify-content: center; } 
        
        /* g6-h6: Hasil Partikel (x:37.5%, y:55.55%, w:12.5%, h:11.11%) */
        #calc-result-partikel { left: 37.5%; top: 55.55%; width: 12.5%; height: 11.11%; justify-content: center; }

    </style>
</head>
<body>

<div id="game-container">

    <div id="scene-title" class="layer">
        <div id="layer-titlescreen" class="layer"></div>
        <button class="btn-grid" style="left: 37.5%; top: 55.55%; width: 25%; height: 22.22%; z-index: 52;" onclick="mulaiSimulasi()"></button>
    </div>

    <div id="scene-partikel" class="layer">
        <div id="layer-canvas-partikel" class="layer"></div>
        
        <div id="layer-lattice-container">
            <div id="infinite-lattice"></div>
        </div>

        <div id="layer-infokey" class="layer"></div>
        <div id="layer-zat-label" class="layer"></div>
        <div id="layer-nav-partikel" class="layer"></div>
        
        <div id="text-mol-display">0 mol</div>

        <button class="btn-grid" style="left: 93.75%; top: 0%; width: 6.25%; height: 11.11%;" onclick="kembaliKeTitle()"></button>

        <button class="btn-grid" style="left: 81.25%; top: 11.11%; width: 18.75%; height: 11.11%;" onclick="alert('Pindah ke Simulasi Mol (Standby)')"></button>
        <button class="btn-grid" style="left: 81.25%; top: 22.22%; width: 18.75%; height: 11.11%;" onclick="alert('Pindah ke Simulasi Molaritas (Standby)')"></button>
        
        <button class="btn-grid" style="left: 81.25%; top: 77.77%; width: 18.75%; height: 11.11%;" onclick="bukaHitungPartikel()"></button>

        <div id="popup-calc-partikel" class="layer popup-layer">
            <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 6.25%; height: 11.11%; z-index: 21;" onclick="tutupHitungPartikel()"></button>
            
            <div id="calc-input-mol" class="calc-text">0 mol</div>
            <div id="calc-result-partikel" class="calc-text">0</div>
        </div>
    </div>

</div>

<script>
    // --- STATE SIMULASI ---
    let globalMol = 1.00; // Coba ubah angka ini menjadi 0 untuk mengetes hilangnya atom

    // Format Desimal 2 Angka (0 mutlak tanpa koma)
    function formatDesimal(angka) {
        if (angka === 0) return "0";
        return angka.toFixed(2).replace('.', ',');
    }

    // --- MANAJEMEN SCENE (TITLE SCREEN) ---
    const sceneTitle = document.getElementById('scene-title');
    const scenePartikel = document.getElementById('scene-partikel');
    const popCalcPartikel = document.getElementById('popup-calc-partikel');
    const latticeBg = document.getElementById('infinite-lattice');

    function mulaiSimulasi() {
        sceneTitle.style.opacity = '0';
        setTimeout(() => {
            sceneTitle.style.display = 'none';
            scenePartikel.style.display = 'block';
            updateVisualMol();
        }, 500); 
    }

    function kembaliKeTitle() {
        sceneTitle.style.display = 'block';
        void sceneTitle.offsetWidth; 
        sceneTitle.style.opacity = '1';
        scenePartikel.style.display = 'none';
        tutupHitungPartikel();
    }

    // Perbarui visual teks & kemunculan atom
    function updateVisualMol() {
        let txtMol = globalMol === 0 ? "0 mol" : formatDesimal(globalMol) + " mol";
        document.getElementById('text-mol-display').innerText = txtMol;

        // Logika Peniadaan Atom Jika Mol 0
        if (globalMol === 0) {
            latticeBg.style.backgroundImage = 'none';
        } else {
            latticeBg.style.backgroundImage = "url('mbpartna.png'), url('mbpartcl.png')";
        }
    }

    // --- LOGIKA PERHITUNGAN POP-UP ---
    function bukaHitungPartikel() {
        let txtMolInput = globalMol === 0 ? "0 mol" : formatDesimal(globalMol) + " mol";
        document.getElementById('calc-input-mol').innerText = txtMolInput;

        let hasilKoefisien = globalMol * 6.022;
        let txtHasil = globalMol === 0 ? "0" : formatDesimal(hasilKoefisien);
        
        document.getElementById('calc-result-partikel').innerText = txtHasil;
        popCalcPartikel.style.display = 'block';
    }

    function tutupHitungPartikel() {
        popCalcPartikel.style.display = 'none';
    }

    // --- INFINITE DRAG & DRIFT ENGINE ---
    const latticeContainer = document.getElementById('layer-lattice-container');
    
    let isDragging = false;
    let startX, startY;
    let driftX = 0, driftY = 0; 

    // Render loop untuk menggerakkan posisi background (Auto-drift & Drag)
    function renderInfinity() {
        if (!isDragging && globalMol > 0) {
            driftX += 0.3; // Kecepatan hanyut horizontal
            driftY += 0.3; // Kecepatan hanyut vertikal
        }
        
        latticeBg.style.backgroundPosition = `${driftX}px ${driftY}px, calc(${driftX}px + 3cqw) calc(${driftY}px + 3cqw)`;
        requestAnimationFrame(renderInfinity);
    }
    renderInfinity(); 

    // Kontrol Mouse
    latticeContainer.addEventListener('mousedown', (e) => {
        isDragging = true; startX = e.clientX; startY = e.clientY;
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mouseleave', () => { isDragging = false; });
    
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let dx = e.clientX - startX;
        let dy = e.clientY - startY;
        driftX += dx; driftY += dy;
        startX = e.clientX; startY = e.clientY;
    });

    // Kontrol Layar Sentuh (Mobile)
    latticeContainer.addEventListener('touchstart', (e) => {
        isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    });
    window.addEventListener('touchend', () => { isDragging = false; });
    
    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        let dx = e.touches[0].clientX - startX;
        let dy = e.touches[0].clientY - startY;
        driftX += dx; driftY += dy;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    });

</script>
</body>
</html>
